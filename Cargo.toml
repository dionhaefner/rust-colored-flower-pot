[package]
name = "rcfp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
libloading = "0.8.5"
png = "0.17.14"
regex = "1.11.1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = { version = "1.0.128", features = ["preserve_order", "float_roundtrip"] }
tiny_http = "0.12.0"
mysql = { version = "=28.0.3", default-features = false, features = ["minimal-rust", "native-tls"] }
postgres = "=0.19.10"
postgres-native-tls = "=0.5.0"
native-tls = { version = "0.2", features = ["vendored"] }
url = "=2.5.4"
aws-config = { version = "=1.8.10", default-features = false, features = ["rt-tokio", "default-https-client", "sso"] }
aws-credential-types = "=1.2.8"
tokio = { version = "1", features = ["rt-multi-thread"] }
rust-s3 = { version = "=0.38.0", default-features = false, features = ["sync-native-tls", "fail-on-err"] }
toml = "=0.8.23"
ureq = "=2.12.1"
flate2 = "=1.1.10"
crc32fast = "=1.5.2"

[lib]
name = "rcfp_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "rcfp"
path = "src/main.rs"

[features]
# Explicit local services; ordinary offline unit tests do not require sockets/engines.
storage-integration = []

[[test]]
name = "storage_remote"
required-features = ["storage-integration"]

[[test]]
name = "storage_sql"
required-features = ["storage-integration"]
