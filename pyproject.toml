[build-system]
requires = ["hatchling>=1.27,<2", "hatch-vcs>=0.4,<1", "rustup==1.29.0.1", "zstandard==0.25.0", "patchelf==0.17.2.4; sys_platform == 'linux'", "setuptools>=80,<81; sys_platform == 'win32'"]
build-backend = "hatchling.build"

[project]
name = "rcfp"
dynamic = ["version"]
description = "RCFP raster tile server with a shared Rust core"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=2,<3",
]

[project.scripts]
rcfp = "rcfp_cli:main"

[tool.hatch.version]
source = "vcs"
tag-pattern = '^v(?P<version>\d+\.\d+\.\d+)$'
fallback-version = "0.1.0"

[tool.hatch.version.raw-options]
git_describe_command = "git describe --dirty --tags --long --match 'v[0-9]*'"

[tool.hatch.build.hooks.vcs]
version-file = "python/rcfp/_version.py"

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["python/rcfp"]
dev-mode-dirs = ["python"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "packaging/hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"python/rcfp_cli.py" = "rcfp_cli.py"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
only-include = [
  "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "LICENSE",
  "THIRD_PARTY_NOTICES.md", "README.md", "pyproject.toml",
  "packaging", "python/native.c", "python/rcfp", "python/rcfp_cli.py", "src", "js", "tests", "docs",
]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.egg-info", "**/node_modules/**", "docs/_build/**"]


[tool.hatch.build.targets.sdist.force-include]
"python/rcfp/_version.py" = "python/rcfp/_version.py"
"docs/_generated" = "docs/_generated"

[tool.ruff]
target-version = "py312"
