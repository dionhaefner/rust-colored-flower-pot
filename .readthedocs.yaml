version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    rust: "1.88"
  jobs:
    post_install:
      - python docs/tools/generate_reference.py
    post_build:
      - python docs/tools/check_links.py "$READTHEDOCS_OUTPUT/html"

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .

sphinx:
  configuration: docs/conf.py
  builder: html
  fail_on_warning: true
