<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Published raster snapshot</title>
  <label for="url">Image URL</label>
  <input id="url" size="80" />
  <button id="load">Load snapshot</button>
  <p id="status" role="status"></p>
  <img id="image" alt="Selected raster snapshot" crossorigin="anonymous" />
  <script type="module">
    const input = document.querySelector("#url");
    const status = document.querySelector("#status");
    const image = document.querySelector("#image");
    input.value = new URLSearchParams(location.search).get("url") || "";
    document.querySelector("#load").addEventListener("click", async () => {
      try {
        const url = new URL(input.value, location.href);
        url.searchParams.delete("revision");
        const response = await fetch(url, {
          method: "HEAD",
          cache: "no-cache",
        });
        if (!response.ok)
          throw new Error(`Image request failed (${response.status})`);
        const revision = response.headers.get("X-RCFP-Revision");
        if (!revision)
          throw new Error("The server did not provide a render revision");
        url.searchParams.set("revision", revision);
        image.src = url.href;
        status.textContent = url.href;
      } catch (error) {
        status.textContent = error.message;
      }
    });
  </script>
</html>
