worker_processes 1;
daemon off;
pid @WORK@/nginx.pid;
error_log @WORK@/nginx-error.log;
events { worker_connections 256; }
http {
    proxy_cache_path @WORK@/cache levels=1:2 keys_zone=rcfp:8m max_size=64m inactive=1d;
    log_format caching '$request_uri $upstream_cache_status $upstream_status $body_bytes_sent';
    access_log @WORK@/nginx-access.log caching;
    client_body_temp_path @WORK@/body;
    proxy_temp_path @WORK@/temp;
    fastcgi_temp_path @WORK@/fastcgi;
    uwsgi_temp_path @WORK@/uwsgi;
    scgi_temp_path @WORK@/scgi;
    server {
        listen 127.0.0.1:@PORT@;
        location = /example {
            default_type text/html;
            alias @EXAMPLE@;
        }
        location / {
            proxy_pass @ORIGIN@;
            proxy_cache rcfp;
            proxy_cache_key "$scheme$proxy_host$request_uri";
            proxy_cache_lock on;
            proxy_cache_revalidate on;
            proxy_cache_bypass $http_authorization $http_cookie;
            proxy_no_cache $http_authorization $http_cookie;
            add_header X-Proxy-Cache $upstream_cache_status always;
        }
    }
}
