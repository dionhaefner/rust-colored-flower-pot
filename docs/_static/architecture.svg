<svg xmlns="http://www.w3.org/2000/svg" width="780" height="390" viewBox="0 0 780 390" role="img" aria-labelledby="title description">
  <title id="title">RCFP shared core and application ownership</title>
  <desc id="description">Native HTTP, Python and WSGI, and Lambda adapters use a shared Rust catalog and rendering core, a bounded queue, worker-owned GDAL and PROJ handles and caches. Catalogs and raster files remain separate data sources.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#704632"/></marker></defs>
  <rect width="780" height="390" rx="12" fill="#fff9f3"/>
  <g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#312820">
    <g fill="#f4ddcc" stroke="#a65a38" stroke-width="2"><rect x="24" y="24" width="224" height="48" rx="8"/><rect x="278" y="24" width="224" height="48" rx="8"/><rect x="532" y="24" width="224" height="48" rx="8"/></g>
    <text x="136" y="54">Native HTTP</text><text x="390" y="54">Python / WSGI</text><text x="644" y="54">Lambda</text>
    <rect x="100" y="115" width="580" height="48" rx="8" fill="#e8eddb" stroke="#657842" stroke-width="2"/>
    <text x="390" y="145">Shared Rust catalog and rendering core</text>
    <rect x="100" y="205" width="580" height="64" rx="8" fill="#e8eddb" stroke="#657842" stroke-width="2"/>
    <text x="390" y="231">Bounded queue · GDAL / PROJ workers</text><text x="390" y="254" font-size="15">Application-owned handles, caches, and snapshot leases</text>
    <g fill="#ede8e3" stroke="#887566" stroke-width="2"><rect x="90" y="315" width="255" height="48" rx="8"/><rect x="435" y="315" width="255" height="48" rx="8"/></g>
    <text x="217" y="345">Catalog metadata</text><text x="562" y="345">Raster files / COGs</text>
  </g>
  <g stroke="#704632" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M136 72 V90 H280 V114"/><path d="M390 72 V114"/><path d="M644 72 V90 H500 V114"/><path d="M390 163 V204"/><path d="M280 269 V292 H217 V314"/><path d="M500 269 V292 H562 V314"/></g>
</svg>
