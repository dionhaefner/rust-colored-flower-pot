name: Build and test wheels

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            id: linux-x86_64
          - os: ubuntu-24.04-arm
            id: linux-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build AL2023 bundle and repaired abi3 wheel
        run: |
          docker build -f packaging/lambda/Dockerfile.ci -t rcfp-wheel .
          id=$(docker create rcfp-wheel)
          mkdir -p build/ci
          docker cp "$id:/wheelhouse" build/ci/ci-wheels
          docker rm "$id"
      - name: Check wheel contents and tag
        run: |
          for wheel in build/ci/ci-wheels/*.whl; do
            python3 packaging/verify-wheel.py "$wheel"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.id }}
          path: build/ci/ci-wheels/*.whl
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            id: macos-x86_64
          - os: macos-14
            id: macos-arm64
          - os: windows-2022
            id: windows-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source build requirements
        run: python -m pip install build==1.3.0 hatchling hatch-vcs rustup==1.29.0.1 zstandard==0.25.0 "setuptools>=80,<81"
      - name: Install wheel repair tool
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            python -m pip install delocate==0.13.0
          else
            python -m pip install delvewheel==1.13.1
          fi
      - name: Install Rust and build the core
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          cargo build --locked --release
      - name: Build and repair wheel
        run: |
          RCFP_NATIVE_TARGET="$PWD/target" python -m build --wheel --no-isolation --outdir build/ci/ci-wheels-raw
          mkdir -p build/ci/ci-wheels
          if [[ "$RUNNER_OS" == macOS ]]; then
            delocate-wheel --require-archs "$(uname -m)" -w build/ci/ci-wheels build/ci/ci-wheels-raw/*.whl
          else
            delvewheel repair --analyze-existing --no-mangle-all -w build/ci/ci-wheels build/ci/ci-wheels-raw/*.whl
          fi
      - name: Check source-built wheel without repair
        run: |
          python -m pip install --no-deps --target build/ci/ci-raw-install build/ci/ci-wheels-raw/*.whl
          PYTHONPATH="$PWD/build/ci/ci-raw-install" python - <<'PYCODE'
          import rcfp
          try:
              rcfp.compute_metadata("rcfp-package-check-missing.tif")
          except rcfp.RcfpError:
              pass
          else:
              raise AssertionError("missing raster unexpectedly opened")
          PYCODE
      - name: Check wheel contents and tag
        run: |
          for wheel in build/ci/ci-wheels/*.whl; do
            python packaging/verify-wheel.py "$wheel"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.id }}
          path: build/ci/ci-wheels/*.whl
          if-no-files-found: error

  installed-wheel:
    needs: [linux, desktop]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {os: ubuntu-24.04, id: linux-x86_64}
          - {os: ubuntu-24.04-arm, id: linux-aarch64}
          - {os: macos-15-intel, id: macos-x86_64}
          - {os: macos-14, id: macos-arm64}
          - {os: windows-2022, id: windows-amd64}
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.platform.id }}
          path: build/ci/ci-wheels
      - name: Install final wheel with pip and verify runtime
        run: |
          python -m venv build/ci/ci-wheel-venv
          if [[ "$RUNNER_OS" == Windows ]]; then
            wheel_python=build/ci/ci-wheel-venv/Scripts/python.exe
          else
            wheel_python=build/ci/ci-wheel-venv/bin/python
          fi
          "$wheel_python" -m pip install build/ci/ci-wheels/*.whl
          "$wheel_python" -I -c "import rcfp; print(rcfp.__file__)"
          for wheel in build/ci/ci-wheels/*.whl; do
            "$wheel_python" packaging/verify-wheel.py "$wheel"
          done
          "$wheel_python" -I -c "import rcfp; assert rcfp._native.__file__.endswith(('.abi3.so', '.abi3.pyd'))"
          "$wheel_python" -I - <<'PYCODE'
          import rcfp
          try:
              rcfp.compute_metadata("rcfp-package-check-missing.tif")
          except rcfp.RcfpError:
              pass
          else:
              raise AssertionError("missing raster unexpectedly opened")
          PYCODE
          "$wheel_python" -m pip install "numpy>=2.2,<3" "Pillow>=11.3,<13"
          "$wheel_python" tests/contract_suite.py --wheel build/ci/ci-wheels/*.whl --out build/ci/ci-contracts
          if [[ "${{ matrix.python-version }}" == "3.12" ]]; then
            "$wheel_python" -m pip install rasterio==1.4.4
            "$wheel_python" tests/platform_smoke.py --out build/ci/ci-wheel-smoke
            "$wheel_python" -m pip uninstall -y rasterio numpy Pillow
            "$wheel_python" packaging/verify-runtime-without-rasterio.py --database build/ci/ci-wheel-smoke/platform.sqlite
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wheel-test-${{ matrix.platform.id }}-py${{ matrix.python-version }}
          path: |
            build/ci/ci-wheel-smoke/
            build/ci/ci-contracts/
          retention-days: 14
