name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  wheels:
    uses: ./.github/workflows/wheels.yml

  native-platforms:
    uses: ./.github/workflows/platforms.yml

  correctness:
    uses: ./.github/workflows/correctness.yml

  docs:
    uses: ./.github/workflows/docs.yml

  sdist:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check source distribution
        run: |
          python -m pip install build==1.3.0 twine==6.2.0
          python -m build --sdist
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  assemble:
    needs:
      - wheels
      - native-platforms
      - correctness
      - docs
      - sdist

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a tag on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: source-distribution
          path: dist

      - name: Check distribution metadata
        run: |
          python3 -m pip install twine==6.2.0
          python3 -m twine check --strict dist/*

      - name: Verify tag, source and all five tested wheels
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 packaging/verify-release.py dist "$RELEASE_TAG" | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: |
            dist/*
            SHA256SUMS
          if-no-files-found: error

  publish:
    needs: assemble
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: .

      - name: Publish the tested files
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
