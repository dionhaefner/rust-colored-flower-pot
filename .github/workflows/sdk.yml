name: JavaScript SDK qualification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install pinned package tools
        run: |
          npm install --global npm@11.6.2 --ignore-scripts
          npm ci --prefix packaging/sdk --ignore-scripts --no-audit --no-fund

      - name: Check SDK contracts, releases and declarations
        run: |
          node tests/sdk_contracts.mjs
          node tests/sdk_release.mjs
          node packaging/sdk/node_modules/typescript/bin/tsc --strict --noEmit --module nodenext --target es2022 tests/sdk_types.mts

      - name: Pack and test the installed public package
        run: node tests/sdk_package.mjs build/ci/sdk-${{ matrix.node }}

      - name: Retain the tested npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: sdk-package-${{ matrix.node }}
          path: |
            build/ci/sdk-${{ matrix.node }}/*.tgz
            build/ci/sdk-${{ matrix.node }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 70

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: qualification
          create-args: >-
            python=3.12 pip gdal=3.10.3 numpy=2 pillow rasterio=1.4.4
          cache-environment: true
          init-shell: bash

      - name: Install Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Verify independent Python and SDK versions
        run: |
          python -m pip install hatch-vcs==0.5.0
          python tests/sdk_versioning.py

      - name: Build and install the RCFP wheel
        run: |
          python -m pip wheel --no-deps . --wheel-dir build/ci/browser-wheel
          python -m pip install build/ci/browser-wheel/*.whl
          binary="$(python -c 'import rcfp; print(rcfp._RUNTIME_ROOT / "bin" / "rcfp")')"
          echo "RCFP_BROWSER_BINARY=$binary" >> "$GITHUB_ENV"

      - name: Install Chromium test runner
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Exercise the browser client
        run: python tests/browser_contracts.py --binary "$RCFP_BROWSER_BINARY" --out build/ci/browser

      - name: Exercise STAC CLI and browser
        run: python tests/stac_serving.py --binary "$RCFP_BROWSER_BINARY" --wheel build/ci/browser-wheel/*.whl --browser --out build/ci/stac-serving

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correctness-browser
          path: |
            build/ci/browser/
            build/ci/stac-serving/
          retention-days: 14
