name: Correctness qualification

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 3 * * 0"

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: qualification
          create-args: >-
            python=3.12 pip gdal=3.10.3 numpy pillow
          cache-environment: true
          init-shell: bash

      - name: Install Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Locate GDAL runtime
        run: python tests/ci-gdal-env.py

      - name: Build candidate
        run: cargo build --locked --release

      - name: Prepare pinned reference release
        run: tests/reference/bootstrap.sh

      - name: Verify public corpus and corruption controls
        run: |
          .venv-reference/bin/python tests/corpus_contracts.py --out build/ci/corpus
          .venv-reference/bin/python -m unittest discover -s tests -p 'test_corpus_contracts.py'
          python -m unittest discover -s tests/reference -p 'test_*.py'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correctness-corpus
          path: build/ci/corpus/
          retention-days: 14

      - name: Compare HTTP and images
        run: |
          python tests/reference/differential.py \
            --binary target/release/rcfp \
            --reference-python .venv-reference/bin/python \
            --out build/ci/differential

          RCFP_COMPAT_PROFILE=terracotta \
            TC_RUST_MERCATOR_FAST=1 \
            TC_PREFETCH_TILE_RING=1 \
            TC_RUST_UTM_FAST=1 \
            python tests/reference/differential.py \
            --binary target/release/rcfp \
            --reference-python .venv-reference/bin/python \
            --out build/ci/differential-compatibility

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correctness-differential
          path: |
            build/ci/differential/
            build/ci/differential-compatibility/
          retention-days: 14

      - name: Compare broader raster boundaries
        run: |
          .venv-reference/bin/python tests/reference/raster_boundaries.py \
            --library target/release/librcfp_core.so \
            --reference-python .venv-reference/bin/python \
            --out build/ci/raster-boundaries --download

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correctness-raster-boundaries
          path: build/ci/raster-boundaries/
          retention-days: 14

      - name: Qualify exact TIFF access and fallbacks
        run: |
          .venv-reference/bin/python tests/tiff_backend.py \
            --target target --out build/ci/tiff-backend

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correctness-tiff-backend
          path: build/ci/tiff-backend/
          retention-days: 14

  services:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    services:
      mysql:
        image: mysql@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
        env:
          MYSQL_ROOT_PASSWORD: rcfp-ci
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -prcfp-ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

      postgres:
        image: postgres@sha256:21f6013073bc6b92830a2129570e2f5ec42a6c734b5a985a41e83aa58f54c3c1
        env:
          POSTGRES_PASSWORD: rcfp-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      RCFP_TEST_MYSQL_URL: mysql://root:rcfp-ci@127.0.0.1:3306?sslmode=disable
      RCFP_TEST_POSTGRESQL_URL: postgresql://postgres:rcfp-ci@127.0.0.1:5432?sslmode=disable

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: qualification
          create-args: >-
            python=3.12 pip gdal=3.10.3 pillow
          cache-environment: true
          init-shell: bash

      - name: Install Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component llvm-tools-preview

      - name: Install Rust coverage tool
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.5
          fallback: none

      - name: Locate GDAL runtime
        run: python tests/ci-gdal-env.py

      - name: Build native adapter
        run: cargo build --locked --release

      - name: Run Rust unit and integration tests with source coverage
        run: |
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov clean --workspace
          cargo test --locked --features storage-integration --all-targets -- --nocapture
          cargo build --locked
          python tests/storage_contracts.py \
            --binary target/debug/rcfp \
            --out build/ci/storage-contracts-coverage

          mkdir -p build/ci/coverage
          cargo llvm-cov report --lcov --output-path build/ci/coverage/rust.lcov
          python tests/coverage-summary.py \
            rust \
            build/ci/coverage/rust.lcov \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Run catalog and HTTP contracts on each engine
        run: |
          python tests/storage_contracts.py \
            --binary target/release/rcfp \
            --out build/ci/storage-contracts

          RCFP_COMPAT_PROFILE=terracotta \
            python tests/storage_contracts.py \
            --binary target/release/rcfp \
            --out build/ci/storage-contracts-compatibility

      - name: Prepare pinned reference release
        run: tests/reference/bootstrap.sh

      - name: Check the reference release test baseline
        run: |
          python tests/reference/upstream.py \
            --reference-python .venv-reference/bin/python \
            --mysql-server root:rcfp-ci@127.0.0.1:3306 \
            --postgresql-server postgres:rcfp-ci@127.0.0.1:5432 \
            --out build/ci/upstream

      - name: Compare installed compatibility drivers on live SQL engines
        run: |
          python -m pip install build==1.3.0 hatchling hatch-vcs zstandard==0.25.0 rustup==1.29.0.1

          RCFP_NATIVE_TARGET="$PWD/target" \
            python -m build \
            --wheel \
            --no-isolation \
            --outdir build/ci/compatibility-wheels

          python -m venv build/ci/compatibility-env
          build/ci/compatibility-env/bin/python -m pip install \
            build/ci/compatibility-wheels/*.whl \
            Pillow \
            SQLAlchemy \
            PyMySQL \
            psycopg2-binary

          RCFP_COMPAT_PROFILE=terracotta \
            build/ci/compatibility-env/bin/python tests/compatibility_sql.py \
            --wheel build/ci/compatibility-wheels/*.whl \
            --reference-python .venv-reference/bin/python \
            --out build/ci/compatibility-sql

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correctness-storage
          path: |
            build/ci/storage-contracts/
            build/ci/storage-contracts-compatibility/
            build/ci/storage-contracts-coverage/report.json
            build/ci/coverage/rust.lcov
            build/ci/upstream/
            build/ci/compatibility-sql/
          retention-days: 14

  browser:
    uses: ./.github/workflows/sdk.yml

  large-raster:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/')

    runs-on: ubuntu-24.04
    timeout-minutes: 120

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: qualification
          create-args: >-
            python=3.12 pip gdal=3.10.3 rasterio=1.4.4 numpy=2 pillow tifffile
          cache-environment: true
          init-shell: bash

      - name: Install Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Locate GDAL runtime
        run: python tests/ci-gdal-env.py

      - name: Build native server
        run: cargo build --locked --release

      - name: Verify physical BigTIFF and range reads
        run: |
          python tests/large_raster_contracts.py \
            --binary target/release/rcfp \
            --out build/ci/large-raster

      - name: Exercise bounded concurrent raster serving
        run: |
          python tests/resource_contracts.py \
            --binary target/release/rcfp \
            --out build/ci/resources \
            --seconds 180

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correctness-large-raster
          path: |
            build/ci/large-raster/report.json
            build/ci/large-raster/service.log
            build/ci/resources/report.json
            build/ci/resources/service.log
          retention-days: 14
