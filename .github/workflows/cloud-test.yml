name: Disposable cloud host qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/cloud-test/**"
      - "packaging/ec2-comparison/**"
      - "packaging/demo/prepare.py"
      - "packaging/lambda/**"
      - "tests/cloud_deployment.py"
      - "tests/cloud_test_contracts.py"
      - "tests/test_ec2_comparison.py"
      - "tests/ec2_map_benchmark.py"
      - "tests/ec2_user_benchmark.py"
      - "tests/map_sessions.py"
      - "tests/map_session_contracts.py"
      - "tests/map_session_quality.py"
      - "tests/test_map_sessions.py"
      - "tests/lambda_map_benchmark.py"
      - "tests/benchmarks/lambda-map.html"
      - "tests/benchmarks/map-session.html"
      - "tests/fixtures/demo/**"
      - "docs/examples/data/**"
      - "src/**"
      - "js/sdk/**"
      - "Cargo.*"
      - ".github/workflows/cloud-test.yml"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install qualification tools
        run: |
          python -m pip install cfn-lint==1.40.4 pillow==11.3.0 playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Validate infrastructure
        run: cfn-lint packaging/cloud-test/storage.yaml packaging/cloud-test/template.yaml
      - name: Check detached comparison startup and storage ownership
        run: python -m unittest discover -s tests -p test_ec2_comparison.py
      - name: Check map session timing and browser measurements
        run: |
          python -m unittest discover -s tests -p test_map_sessions.py
          python tests/map_session_contracts.py --out build/ci/map-sessions
      - name: Build a Linux native bundle
        run: |
          docker build --platform linux/amd64 -f packaging/lambda/Dockerfile.ci -t rcfp-cloud-build .
          id=$(docker create rcfp-cloud-build)
          mkdir -p build/ci
          docker cp "$id:/bundle" build/ci/cloud-bundle
          docker rm "$id"
      - name: Check packaging, lifecycle, HTTP and browser without credentials
        run: python tests/cloud_test_contracts.py --bundle build/ci/cloud-bundle --out build/ci/cloud-test
      - name: Retain the checked native bundle
        run: |
          tar -czf build/ci/cloud-bundle.tar.gz -C build/ci cloud-bundle
          sha256sum build/ci/cloud-bundle.tar.gz > build/ci/cloud-bundle.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-test-${{ github.sha }}
          path: |
            build/ci/cloud-test/report.json
            build/ci/cloud-test/*/*.json
            build/ci/cloud-test/*/*.log
            build/ci/cloud-test/*/client/
            build/ci/cloud-test/*/failed-client/
            build/ci/cloud-test/*/invalid-image/
            build/ci/cloud-test/*/bad-reference/
            build/ci/map-sessions/report.json
            build/ci/map-sessions/*/result.json
            build/ci/map-sessions/*/final-view.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-native-bundle-${{ github.sha }}
          path: build/ci/cloud-bundle.tar.gz*
          retention-days: 7
