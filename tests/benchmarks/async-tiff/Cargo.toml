[package]
name = "rcfp-raster-probe"
version = "0.1.0"
edition = "2024"
publish = false

# Independent benchmark dependency graph; never linked into shipped RCFP.
[workspace]

[dependencies]
rcfp = { path = "../../.." }
async-tiff = { version = "=0.4.0", default-features = false }
async-trait = "=0.1.89"
bytes = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
sha2 = "0.10"

[features]
extra-codecs = ["async-tiff/lerc", "async-tiff/lzma", "async-tiff/webp", "async-tiff/jpeg2k"]
