AWSTemplateFormatVersion: "2010-09-09"
Description: Private raster storage and container registry for the RCFP demo.
Resources:
  Data:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
  DataPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: Data
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - Fn::GetAtt: [Data, Arn]
              - Fn::Sub: "${Data.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
  Images:
    Type: AWS::ECR::Repository
    Properties:
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: false
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
            Condition:
              ArnLike:
                aws:SourceArn:
                  Fn::Sub: "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:*"
Outputs:
  DataBucket:
    Value:
      Ref: Data
  RepositoryName:
    Value:
      Ref: Images
  RepositoryUri:
    Value:
      Fn::GetAtt: [Images, RepositoryUri]
