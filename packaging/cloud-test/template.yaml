AWSTemplateFormatVersion: "2010-09-09"
Description: Disposable Ubuntu RCFP test host with SSM access and scheduled expiry.
Parameters:
  ImageId:
    Type: AWS::EC2::Image::Id
  RootDevice:
    Type: String
    Default: /dev/sda1
  InstanceType:
    Type: String
    Default: c7i.2xlarge
    AllowedValues:
      - c7i.large
      - c7i.xlarge
      - c7i.2xlarge
      - c7i.4xlarge
      - c7i-flex.large
      - m7i-flex.large
  ClientCidr:
    Type: String
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/32'
    Description: Single public IPv4 client address allowed to reach port 5000.
  DataBucket:
    Type: String
  ImageRepositoryArn:
    Type: String
    Default: ""
    Description: Optional private ECR repository read by containerized test servers.
  CommandTargetInstanceArn:
    Type: String
    Default: ""
    Description: Optional single benchmark server controlled by this host.
  CommandReportsPrefix:
    Type: String
    Default: "runs/unconfigured/comparison/"
    AllowedPattern: "runs/[A-Za-z0-9-]+/comparison/"
  ExpiresAt:
    Type: String
    AllowedPattern: '\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} UTC'
Conditions:
  ControlHost:
    Fn::Not:
      - Fn::Equals: [{ Ref: CommandTargetInstanceArn }, ""]
  PullImages:
    Fn::Not:
      - Fn::Equals: [{ Ref: ImageRepositoryArn }, ""]
Resources:
  Network:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.83.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
  Gateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId:
        Ref: Network
      InternetGatewayId:
        Ref: Gateway
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Network
      CidrBlock: 10.83.0.0/24
      MapPublicIpOnLaunch: true
  Routes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: Network
  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId:
        Ref: Routes
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId:
        Ref: Gateway
  SubnetRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: Subnet
      RouteTableId:
        Ref: Routes
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId:
        Ref: Network
      VpcEndpointType: Gateway
      ServiceName:
        Fn::Sub: "com.amazonaws.${AWS::Region}.s3"
      RouteTableIds:
        - Ref: Routes
  Firewall:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId:
        Ref: Network
      GroupDescription: RCFP test API access from one operator address.
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          CidrIp:
            Ref: ClientCidr
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Fn::Sub: "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      Policies:
        - PolicyName: TestData
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - Fn::Sub: "arn:${AWS::Partition}:s3:::${DataBucket}/artifacts/*"
                  - Fn::Sub: "arn:${AWS::Partition}:s3:::${DataBucket}/rasters/*"
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  Fn::Sub: "arn:${AWS::Partition}:s3:::${DataBucket}/runs/${AWS::StackName}/*"
  ImageReads:
    Type: AWS::IAM::Policy
    Condition: PullImages
    Properties:
      PolicyName: TestImageReads
      Roles:
        - Ref: Role
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: "*"
          - Effect: Allow
            Action:
              [
                ecr:BatchCheckLayerAvailability,
                ecr:GetDownloadUrlForLayer,
                ecr:BatchGetImage,
              ]
            Resource:
              Ref: ImageRepositoryArn
  BenchmarkControl:
    Type: AWS::IAM::Policy
    Condition: ControlHost
    Properties:
      PolicyName: BenchmarkServerControl
      Roles:
        - Ref: Role
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: ssm:SendCommand
            Resource:
              - Ref: CommandTargetInstanceArn
              - Fn::Sub:
                  - "arn:${AWS::Partition}:ssm:${TargetRegion}::document/AWS-RunShellScript"
                  - TargetRegion:
                      Fn::Select:
                        [
                          3,
                          {
                            Fn::Split: [":", { Ref: CommandTargetInstanceArn }],
                          },
                        ]
          - Effect: Allow
            Action: ssm:GetCommandInvocation
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion:
                  Fn::Select:
                    [3, { Fn::Split: [":", { Ref: CommandTargetInstanceArn }] }]
          - Effect: Allow
            Action: s3:GetObject
            Resource:
              Fn::Sub: "arn:${AWS::Partition}:s3:::${DataBucket}/${CommandReportsPrefix}*"
          - Effect: Allow
            Action: s3:ListBucket
            Resource:
              Fn::Sub: "arn:${AWS::Partition}:s3:::${DataBucket}"
            Condition:
              StringLike:
                s3:prefix:
                  Fn::Sub: "${CommandReportsPrefix}*"
  Profile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - Ref: Role
  Launch:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId:
          Ref: ImageId
        InstanceType:
          Ref: InstanceType
        IamInstanceProfile:
          Arn:
            Fn::GetAtt: [Profile, Arn]
        SecurityGroupIds:
          - Ref: Firewall
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        InstanceInitiatedShutdownBehavior: terminate
        BlockDeviceMappings:
          - DeviceName:
              Ref: RootDevice
            Ebs:
              VolumeType: gp3
              VolumeSize: 40
              Encrypted: true
              DeleteOnTermination: true
        UserData:
          Fn::Base64:
            Fn::Sub: |
              #!/bin/bash
              set -euo pipefail
              mkdir -p /opt/rcfp /var/lib/rcfp
              cat > /etc/systemd/system/rcfp-expire.service <<'UNIT'
              [Unit]
              Description=Collect RCFP test results and terminate the host
              [Service]
              Type=oneshot
              ExecStart=/bin/sh -c 'timeout 90s /usr/bin/python3 /opt/rcfp/remote.py collect --stop || true; /sbin/poweroff'
              TimeoutStartSec=120
              UNIT
              cat > /etc/systemd/system/rcfp-expire.timer <<'UNIT'
              [Unit]
              Description=Expire the disposable RCFP test host
              [Timer]
              OnCalendar=${ExpiresAt}
              Persistent=true
              AccuracySec=1s
              [Install]
              WantedBy=timers.target
              UNIT
              systemctl daemon-reload
              systemctl enable --now rcfp-expire.timer
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y python3-boto3
              snap start amazon-ssm-agent
              useradd --system --home-dir /var/lib/rcfp --shell /usr/sbin/nologin rcfp
              chown rcfp:rcfp /var/lib/rcfp
              touch /var/lib/rcfp-ready
  Host:
    Type: AWS::EC2::Instance
    DependsOn: [InternetRoute, SubnetRoutes, S3Endpoint]
    Properties:
      LaunchTemplate:
        LaunchTemplateId:
          Ref: Launch
        Version:
          Fn::GetAtt: [Launch, LatestVersionNumber]
      SubnetId:
        Ref: Subnet
      Tags:
        - Key: Name
          Value:
            Ref: AWS::StackName
        - Key: ExpiresAt
          Value:
            Ref: ExpiresAt
Outputs:
  InstanceId:
    Value:
      Ref: Host
  ApiUrl:
    Value:
      Fn::Sub: "http://${Host.PublicIp}:5000"
