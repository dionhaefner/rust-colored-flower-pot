exclude: ^(rewrite/validation/evidence/|src/assets/(client/|static/|swagger\.json$))

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(packaging/|python/|tests/).*\.py$
        exclude: ^python/rcfp/_version\.py$
      - id: ruff-format
        files: ^(packaging/|python/|tests/).*\.py$
        exclude: ^python/rcfp/_version\.py$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^packaging/

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: [-w, -i, "4"]
        files: ^packaging/

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        files: ^python/native\.c$

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write
        language: node
        additional_dependencies: [prettier@3.9.9]
        files: \.(css|html|js|json|md|ya?ml)$
        types: [file]

      - id: cargo-fmt
        name: cargo fmt
        entry: packaging/cargo.sh fmt --all
        language: system
        files: ^(Cargo\.toml$|src/.*\.rs$|tests/.*\.rs$)
        pass_filenames: false
        require_serial: true

      - id: cargo-clippy
        name: cargo clippy
        entry: packaging/cargo.sh clippy --locked --all-targets -- -D warnings
        language: system
        files: ^(Cargo\.toml$|src/.*\.rs$|tests/.*\.rs$)
        pass_filenames: false
        require_serial: true
